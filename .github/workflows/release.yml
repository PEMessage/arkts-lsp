name: Release

# workflow_dispatch only. Each run (re)publishes a single "nightly" tag by
# default: an existing release/tag with that name is deleted first, so the
# assets and the tag are always overwritten.
#
# Publishes:
#   1. arkts-lsp-<version>.tgz            — this repo's one-click launcher
#      (npm pack; pulls arkts-lsp-proxy as a dependency). Always built.
#   2. ace-server-<deveco-version>.tar.gz — the extracted language server,
#      built only when a DevEco Studio archive is supplied.
#
# The DevEco archive is Huawei proprietary software and is *not* stored in git.
# Provide it via the `deveco_url` input or the DEVECO_ARCHIVE_URL repository
# secret.

on:
  workflow_dispatch:
    inputs:
      deveco_url:
        description: 'URL of devecostudio-mac-*.zip (or .dmg). Leave empty to only release the launcher.'
        required: false
        type: string
      tag:
        description: 'Release tag. Default: nightly. An existing tag/release is deleted and recreated.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Pack the launcher
        run: |
          mkdir -p dist-assets
          npm pack --pack-destination dist-assets
      - id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-assets
          path: dist-assets/*

  ace-server:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve DevEco archive URL
        id: src
        env:
          INPUT_URL: ${{ inputs.deveco_url }}
          SECRET_URL: ${{ secrets.DEVECO_ARCHIVE_URL }}
        run: |
          url="${INPUT_URL:-$SECRET_URL}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -z "$url" ]; then
            echo "No DevEco archive supplied — skipping ace-server extraction."
          fi
      - name: Install extraction tools
        if: steps.src.outputs.url != ''
        run: sudo apt-get update && sudo apt-get install -y p7zip-full unzip
      - name: Download and extract ace-server
        if: steps.src.outputs.url != ''
        env:
          URL: ${{ steps.src.outputs.url }}
        run: |
          mkdir -p downloads dist-assets
          file="downloads/$(basename "${URL%%\?*}")"
          echo "Downloading $URL"
          curl -fL --retry 3 -o "$file" "$URL"
          node extractor/extract-ace-server.mjs --from "$file" --out dist-assets
      - uses: actions/upload-artifact@v4
        if: steps.src.outputs.url != ''
        with:
          name: ace-server-assets
          path: |
            dist-assets/ace-server-*.tar.gz
            dist-assets/ace-server-*.tar.gz.sha256
            dist-assets/manifest.json

  release:
    runs-on: ubuntu-latest
    needs: [package, ace-server]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Determine tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-nightly}" >> "$GITHUB_OUTPUT"
      - name: Delete existing tag/release (overwrite)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting existing release and tag: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          else
            # A tag may exist without a release.
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
          fi
      - name: Create release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh release create "$TAG" assets/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "arkts-lsp \`${VERSION}\` (built from ${GITHUB_SHA}).

          ## Assets

          - \`arkts-lsp-<version>.tgz\` — the one-click launcher (\`npm i -g\` / \`npx\`).
            It pulls the upstream \`arkts-lsp-proxy\` dependency automatically.
          - \`ace-server-<deveco-version>.tar.gz\` — Huawei's ArkTS language server,
            extracted from DevEco Studio. Extract it and point the launcher at it:

            \`\`\`sh
            tar -xzf ace-server-<version>.tar.gz -C ~/.local/share/arkts-lsp
            \`\`\`

          > \`ace-server\` is Huawei proprietary software and remains subject to
          > DevEco Studio's license terms. See \`NOTICE\` in the repository."
