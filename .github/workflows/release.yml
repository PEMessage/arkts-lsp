name: Release

# workflow_dispatch only. Each run (re)publishes a single "nightly" tag by
# default: an existing release/tag with that name is deleted first, so the
# assets and the tag are always overwritten.
#
# Publishes stable, version-less assets:
#   arkts-lsp.tgz      — the one-click launcher, with ace-server bundled inside
#                        (one download is enough).
#   ace-server.tar.gz  — the standalone language server too.
#
# The DevEco archive is Huawei proprietary software and is *not* stored in git.
# Its (signed, expiring) URL comes from the DEVECO_ARCHIVE_URL repository
# secret. Without it, only the launcher is built.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag. Default: nightly. An existing tag/release is deleted and recreated.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build vendored proxy (git submodule)
        run: bash scripts/build-proxy.sh

      - name: Read DevEco archive URL from the secret
        id: src
        env:
          SECRET_URL: ${{ secrets.DEVECO_ARCHIVE_URL }}
        run: |
          echo "url=$SECRET_URL" >> "$GITHUB_OUTPUT"
          if [ -z "$SECRET_URL" ]; then
            echo "DEVECO_ARCHIVE_URL is not set — building the launcher only."
          fi

      - name: Install extraction tools
        if: steps.src.outputs.url != ''
        run: sudo apt-get update && sudo apt-get install -y p7zip-full unzip

      - name: Extract ace-server into the package
        if: steps.src.outputs.url != ''
        env:
          URL: ${{ steps.src.outputs.url }}
        run: |
          mkdir -p downloads
          file="downloads/$(basename "${URL%%\?*}")"
          echo "Downloading DevEco archive"
          curl -fL --retry 3 -o "$file" "$URL"
          # --out . stages ace-server-<ver>/ in the repo root so `npm pack` below
          # bundles it into the launcher tarball.
          node extractor/extract-ace-server.mjs --from "$file" --out .

      - run: npm ci
      - run: npm test

      - name: Pack the launcher (with bundled ace-server)
        run: |
          mkdir -p dist-assets
          npm pack --pack-destination dist-assets
          # Stable, version-less asset name.
          mv dist-assets/arkts-lsp-*.tgz dist-assets/arkts-lsp.tgz

      - name: Collect standalone ace-server assets
        if: steps.src.outputs.url != ''
        run: |
          mv ace-server-*.tar.gz dist-assets/ace-server.tar.gz 2>/dev/null || true
          [ -f manifest.json ] && mv manifest.json dist-assets/manifest.json || true
          if [ -f dist-assets/ace-server.tar.gz ]; then
            (cd dist-assets && sha256sum ace-server.tar.gz > ace-server.tar.gz.sha256)
          fi
          # The staged tree is now inside the npm tarball.
          rm -rf ace-server-*/

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist-assets/**

  release:
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Determine tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: echo "tag=${INPUT_TAG:-nightly}" >> "$GITHUB_OUTPUT"
      - name: Delete existing tag/release (overwrite)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting existing release and tag: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          else
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
          fi
      - name: Create release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" assets/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Built from ${GITHUB_SHA}.

          ## Assets

          - \`arkts-lsp.tgz\` — one download; bundles the launcher, the extractor,
            the vendored \`arkts-lsp-proxy\` and a DevEco \`ace-server\` build.
          - \`ace-server.tar.gz\` — the standalone language server, if you prefer
            to manage it yourself.

          > \`ace-server\` is Huawei proprietary software and remains subject to
          > DevEco Studio's license terms. See \`NOTICE\` in the repository."
